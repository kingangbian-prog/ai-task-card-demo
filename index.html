<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随行 AI · 双屏任务卡 Demo</title><style>
:root{--ink:#101d40;--blue:#165bff;--muted:#75819b;--line:#dce4f2}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:radial-gradient(ellipse at 30% 20%,#e2edff,transparent 60%),#eff3fa}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 17px;background:#fff;color:var(--ink);transition:.2s}button:hover{transform:translateY(-1px);border-color:#82a6ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #88acff;outline-offset:3px}button:disabled{opacity:.4;cursor:default;transform:none}.primary{background:var(--blue);border-color:var(--blue);color:white}header{max-width:1440px;margin:auto;padding:27px 36px;display:flex;align-items:center;gap:22px}.brand{font-size:28px;font-weight:750;letter-spacing:-1px}.mark{color:var(--blue);margin-right:9px;font-size:34px}.tagline{color:#50617f;border-left:1px solid #b8c7de;padding-left:23px}.demo{margin-left:auto;font-size:12px;color:var(--muted)}main{max-width:1440px;margin:10px auto 0;padding:0 28px;display:grid;grid-template-columns:355px minmax(0,1fr);gap:32px}.section-label{display:flex;align-items:center;gap:9px;color:#6b7e9c;font-size:12px;letter-spacing:2px;margin:0 0 12px 6px}.section-label span{letter-spacing:0;margin-left:auto;font-size:11px}.device{height:585px;border:2px solid #b6bdc8;border-radius:32px;position:relative;padding:35px 19px;background:linear-gradient(100deg,#c6cedb,#f5f6f9 9%,#d9dee7 17%,#edf0f6 77%,#cbd2dc);box-shadow:inset 0 0 0 5px #f4f6fa,0 25px 35px -20px #8496b4}.spine{position:absolute;left:22px;top:9px;bottom:9px;width:55px;background:repeating-linear-gradient(90deg,#ccd5e4 0px,#e2e8f2 1px,#d2dbea 2px);border-radius:15px 0 0 15px;border-right:1px solid #c3cbda}.cover{position:relative;margin-left:auto;width:235px;height:259px;border:5px solid #bfc7d3;box-shadow:0 0 0 1px #8d96a8,0 6px 13px #69799433;border-radius:27px;background:linear-gradient(145deg,#192b4f,#0c1831);color:#fff;padding:13px 14px;overflow:auto}.cover-top{display:flex;justify-content:space-between;font-size:10px;color:#c9d6f3;margin-bottom:16px}.cover h3{font-size:17px;line-height:1.45;margin:7px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cover p{font-size:12px;color:#c9d6f3;margin:8px 0 15px;min-height:36px}.cover button{font-size:11px;padding:8px 11px;background:#ffffff12;color:white;border-color:#607095}.cover .primary{background:var(--blue);border-color:var(--blue)}.cover-actions{display:flex;gap:7px}.cover-actions button{flex:1}.orb{display:inline-block;width:19px;height:19px;border:2px solid #6696ff;border-right-color:transparent;border-radius:50%;vertical-align:middle;margin-right:7px}.running .orb{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.device-brand{position:absolute;bottom:42px;right:42px;letter-spacing:5px;color:#8d99ac;font-size:16px}.cover-note{text-align:center;margin:17px 0;color:#7b89a1;font-size:12px}.workspace{background:#ffffffaa;border:1px solid #fff;border-radius:26px;padding:28px;box-shadow:0 20px 40px -25px #6680a5;min-height:585px;position:relative}.work-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.work-head h2{font-size:23px;margin:0}.work-head button{font-size:12px}.composer{display:flex;gap:12px;border:1px solid #d5deef;border-radius:15px;padding:9px;background:white;box-shadow:0 5px 12px #193a7510}.composer input{width:100%;min-width:0;border:0;background:transparent;outline:none;padding:7px;color:var(--ink)}.composer button{white-space:nowrap}.presets{display:flex;gap:8px;margin:12px 0 22px;flex-wrap:wrap}.presets button{padding:5px 10px;background:transparent;border-color:transparent;color:#63769a;font-size:12px}.presets button:hover{background:#e4ecfc}.task{background:white;border-radius:19px;padding:23px;box-shadow:0 4px 20px #21345b05}.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.task h1{font-size:22px;line-height:1.4;margin:0 0 8px;overflow-wrap:anywhere}.status{white-space:nowrap;color:var(--blue);background:#e9f0ff;padding:4px 10px;border-radius:9px;font-size:12px}.description{color:#74829b;font-size:13px;margin:0 0 20px}.timeline{margin:0 0 18px;padding:0;list-style:none}.step{display:flex;gap:13px;padding:9px 12px;border-radius:13px;margin:3px 0}.step.active{background:#edf3ff}.dot{flex-shrink:0;display:grid;place-items:center;width:21px;height:21px;border:2px solid #d3dceb;border-radius:50%;margin-top:3px;font-size:11px;color:white}.step.done .dot{background:var(--blue);border-color:var(--blue)}.step.active .dot{border:6px solid var(--blue)}.step strong{font-size:14px}.step p{color:#7b87a0;font-size:12px;margin:2px 0}.preview{border-radius:14px;background:linear-gradient(110deg,#edf3ff,#e1ecff);padding:17px 20px}.preview h3{font-size:14px;margin:0 0 6px}.preview p{font-size:13px;color:#5d7094;margin:0;white-space:pre-line}.task-actions{display:flex;gap:9px;margin-top:18px}.task-actions button{font-size:12px;padding:8px 13px}.empty{padding:40px 15px;text-align:center}.empty h1{font-size:24px}.empty p{color:var(--muted)}.controls{max-width:1384px;margin:26px auto;padding:17px 22px;background:#ffffffba;border:1px solid #fff;border-radius:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.controls strong{margin-right:12px}.controls small{color:#8290aa;margin-left:auto}.controls button{font-size:12px;padding:8px 13px}.sync{display:flex;align-items:center;gap:7px;color:#6683ad;font-size:11px;margin:12px 5px}.sync:before{content:'';width:6px;height:6px;background:#51bba2;border-radius:50%}.modal-backdrop{position:fixed;inset:0;background:#0b193d55;backdrop-filter:blur(8px);display:grid;place-items:center;z-index:10;padding:20px}.modal{width:470px;max-width:100%;background:white;border-radius:24px;padding:28px;box-shadow:0 30px 100px #071a4444}.modal h2{margin:0 0 9px;font-size:22px}.modal p{color:#76839a;font-size:13px}.modal textarea{width:100%;resize:vertical;min-height:115px;border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0;color:var(--ink)}.modal footer{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}.desktop{min-height:470px;background:linear-gradient(135deg,#dce9fb,#b2c8e5 50%,#e6edfa);border-radius:18px;display:flex;align-items:flex-end;justify-content:flex-end;padding:25px}.mini{width:310px;background:#fffffff0;border:1px solid white;border-radius:20px;padding:23px;box-shadow:0 16px 35px #34568233}.mini h3{font-size:18px}.mini p{color:#72829e}.mini button{font-size:12px;margin:5px 4px 0 0}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#102446;color:white;padding:10px 20px;border-radius:12px;z-index:20;font-size:13px} @media(min-width:1500px){main{margin-top:35px}.device,.workspace{min-height:650px}.device{height:650px}}@media(max-width:1000px){main{grid-template-columns:300px minmax(0,1fr);gap:18px}.workspace{padding:19px}.cover{width:235px}.tagline{font-size:12px}.controls{margin:20px 28px}.task{padding:17px}}@media(max-width:760px){header{padding:20px;flex-wrap:wrap;gap:5px}.brand{font-size:24px}.tagline{order:3;width:100%;border:0;padding:0}.demo{font-size:10px}main{display:flex;flex-direction:column;padding:0 16px}.device{width:330px;height:450px;margin:auto}.workspace{min-height:0;padding:18px}.controls{margin:18px 16px}.controls small{width:100%;margin:0}.work-head h2{font-size:20px}.composer{gap:5px}.composer button{padding:9px}.task h1{font-size:19px}.status{font-size:10px}.cover-note{margin:10px}.desktop{padding:12px}.mini{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cover{padding:10px 12px;overflow:hidden}.cover-top{margin-bottom:8px}.cover h3{font-size:15px;margin:8px 0}.cover p{margin:8px 0 11px;min-height:36px;font-size:11px}.cover-nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;color:#b9cced;font-size:10px}.cover-nav button{font-size:10px;padding:2px 7px;background:transparent;border:0}.cover-footer{display:flex;align-items:center;justify-content:center;gap:13px;margin-top:8px;color:#b9cced;font-size:10px}.cover-footer button{border:0;background:transparent;padding:0 6px;font-size:13px}.cover-row{display:block;width:100%;text-align:left!important;padding:8px!important;margin:5px 0;border-radius:10px!important;line-height:1.35}.cover-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.cover-row span{font-size:9px;color:#b9cced}.cover-row.selected{background:#2654a4!important;border-color:#6093ff!important}.cover-rows{max-height:174px;overflow:auto;scrollbar-width:thin}.task-tabs{display:flex;gap:7px;overflow:auto;margin:-3px 0 15px;padding:3px 0}.task-tab{flex:0 0 auto;padding:7px 11px;font-size:11px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-tab.active{background:#e8f0ff;border-color:#8eb1ff;color:#165bff}.task-tab span{font-size:10px;opacity:.65;margin-left:9px}.cover-top{align-items:center;min-height:27px;margin-bottom:5px}.cover button.cover-new{background:#2d66ff;border:1px solid #5b87ff;border-radius:9px;padding:4px 9px;font-size:11px;font-weight:600;box-shadow:0 3px 10px #071e5544}.cover-rows{max-height:165px}</style></head><body>
<header><div class="brand"><span class="mark">∿</span>随行 AI</div><div class="tagline">同一个任务，在两块屏幕间自然接续</div><div class="demo">交互原型 · 模拟执行</div></header>
<main><section><div class="section-label">外屏 <span>合盖也能交代一件事</span></div><div class="device"><div class="spine"></div><div class="cover" id="cover" aria-live="polite"></div><div class="device-brand">随行 AI</div></div><p class="cover-note">切换查看多个任务 · 点击“＋ 新任务”快速下发</p></section><section><div class="section-label">内屏 <span>与外屏共享同一任务</span></div><div class="workspace"><div class="work-head"><h2>▤ &nbsp;任务工作台</h2><button id="toggle" onclick="toggleMini()">收起为桌面卡片 ↙</button></div><div id="full"><div id="task-tabs" class="task-tabs"></div><form class="composer" id="compose"><input id="prompt" aria-label="任务内容" placeholder="交给 AI 一件事…" maxlength="240" required><button class="primary" type="submit">交给 AI ↗</button></form><div class="presets"><button onclick="preset(0)">整理 AI PC 新闻 ↗</button><button onclick="preset(1)">准备产品评审 ↗</button><button onclick="preset(2)">整理会议纪要 ↗</button></div><div id="task" aria-live="polite"></div></div><div id="desktop" class="desktop hidden"><div class="mini" id="mini" aria-live="polite"></div></div><div class="sync">任务状态实时同步 · 外屏 / 内屏 / 桌面卡片</div></div></section></main>
<div class="controls"><strong>体验完整流程</strong><button class="primary" onclick="newTask()">① 外屏下发任务</button><button onclick="showFull()">② 内屏接续</button><button onclick="advance()" id="next">推进一步 →</button><button onclick="reset()">↻ 重新演示</button><small>进展为模拟数据，可手动推进或自动演示</small><button onclick="autoRun()" id="auto">自动演示</button></div><div id="modal" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=id=>document.getElementById(id);const samples=['整理今天的 AI PC 新闻，选出 3 条重点，生成一页简报。','准备一次 AI 外屏产品评审，整理交互方案和待讨论问题。','把会议记录整理成摘要、决策和行动项。'];let state={title:'整理 AI PC 新闻',request:samples[0],stage:1,paused:false,cancelled:false},miniMode=false,timer=null;
function seedTasks(){return [{title:'整理 AI PC 新闻',request:samples[0],stage:2,paused:false,cancelled:false},{title:'准备产品评审',request:samples[1],stage:3,paused:false,cancelled:false},{title:'整理会议纪要',request:samples[2],stage:5,paused:false,cancelled:false}]}let tasks=seedTasks(),selected=0,coverList=false;state=tasks[0];
const labels=['确认任务','理解任务与规划','核对与整理材料','需要你确认','生成交付结果','任务已完成'];const copy=['确认目标后开始执行','已明确目标与交付物，正在规划步骤','已整理 5 份演示材料，正在核对关键内容','简报按「产品交互」视角展开，可以吗？','已确认方向，正在生成一页简报','一页成果已就绪，可查看或保存'];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(t=state){return t.cancelled?'已取消':t.paused?'已暂停':t.stage===0?'待开始':t.stage===3?'待确认':t.stage===5?'已完成':'进行中'}function brief(){return state.cancelled?'任务已停止，可重新发起':state.paused?'进展已保留，随时继续':copy[state.stage]}function actions(){if(state.cancelled)return '<button onclick="reset()">重新开始</button>';if(state.stage===0)return '<button onclick="newTask()">修改</button><button class="primary" onclick="advance()">确认并开始</button>';if(state.stage===3)return '<button onclick="editDirection()">调整方向</button><button class="primary" onclick="advance()">确认继续</button>';if(state.stage===5)return '<button onclick="newTask()">新任务</button><button class="primary" onclick="result()">查看成果</button>';return `<button onclick="pause()">${state.paused?'继续执行':'暂停'}</button><button class="primary" onclick="showFull()">查看进展</button>`}
function resultText(){return `任务：${state.request}\n\n一、目标与范围\n围绕任务要求整理信息，突出可用于下一步讨论的关键内容。\n\n二、核心结论\n1. 外屏适合快速下发、查看简要状态和处理简单确认。\n2. 内屏承载详细过程、材料和成果编辑。\n3. 同一任务在两块屏幕之间保持状态连续。\n\n三、建议下一步\n验证语音下发、合盖执行与开盖接续的完整体验。\n\n注：以上为交互演示成果，未执行真实搜索、读取文件或模型调用。`}
function render(){let running=!state.paused&&!state.cancelled&&[1,2,4].includes(state.stage);$('cover').className='cover'+(running?' running':'');$('cover').innerHTML=`<div class="cover-top"><span>∿ 随行 AI</span><button class="cover-new" aria-label="启动新任务" onclick="newTask()">＋ 新任务</button></div><h3>${esc(state.title)}</h3><p><span class="orb"></span>${esc(brief())}</p><div class="cover-actions">${actions()}</div>`;renderMulti();let done=state.stage===5;let steps=[['理解任务与规划','明确目标、范围与交付物'],['核对与整理材料','5 份演示材料已就绪，整理重点与来源'],['整理与生成结果','生成摘要和可保存的完整成果']];let current=state.stage<=1?0:state.stage<=3?1:2;$('task').innerHTML=`<div class="task-head"><h1>${esc(state.title)}</h1><span class="status">${status()}</span></div><p class="description">${esc(state.request)}</p><ol class="timeline">${steps.map((s,i)=>`<li class="step ${done||i<current?'done':i===current?'active':''}"><span class="dot">${done||i<current?'✓':''}</span><div><strong>${s[0]}</strong><p>${s[1]}</p></div></li>`).join('')}</ol><div class="preview"><h3>${state.stage===3?'需要你确认':done?'成果已就绪':'当前进展'}</h3><p>${esc(brief())}</p>${state.stage===3?'<button style="margin-top:12px" class="primary" onclick="advance()">按产品交互视角继续</button>':''}</div><div class="task-actions">${state.stage===5?'<button class="primary" onclick="result()">查看完整成果 ↗</button><button onclick="download()">保存 Markdown ↓</button>':state.cancelled?'<button onclick="reset()">重新开始</button>':state.stage===0?'<button class="primary" onclick="advance()">确认并开始</button>':`<button onclick="pause()">${state.paused?'继续执行':'暂停任务'}</button><button onclick="editDirection()">补充要求</button><button onclick="cancelTask()">取消任务</button>`}</div>`;$('mini').innerHTML=`<div class="sync">随行 AI · ${status()}</div><h3>${esc(state.title)}</h3><p>${esc(brief())}</p>${actions()}<button onclick="showFull()">展开任务 ↗</button>`;$('next').disabled=state.stage===5||state.paused||state.cancelled;$('next').textContent=state.stage===3?'确认并继续 →':'推进一步 →'}
function selectTask(i){stop();selected=(i+tasks.length)%tasks.length;state=tasks[selected];coverList=false;render()}function toggleList(){coverList=!coverList;render()}function renderMulti(){let original=$('cover').innerHTML;let nav=`<div class="cover-nav"><button onclick="toggleList()" aria-label="外屏任务列表">☷ ${tasks.length} 个任务</button><span>${coverList?'选择任务':status()}</span></div>`;if(coverList){$('cover').innerHTML=`<div class="cover-top"><span>∿ 随行 AI</span><button class="cover-new" aria-label="启动新任务" onclick="newTask()">＋ 新任务</button></div>${nav}<div class="cover-rows">${tasks.map((t,i)=>`<button class="cover-row ${i===selected?'selected':''}" onclick="selectTask(${i})"><strong>${esc(t.title)}</strong><span>${status(t)}${t.stage===3&&!t.cancelled?' · 需要你确认':''}</span></button>`).join('')}</div>`}else{$('cover').innerHTML=original.replace('</div><h3>','</div>'+nav+'<h3>')+`<div class="cover-footer"><button aria-label="上一个任务" onclick="selectTask(selected-1)">‹</button><span>${selected+1} / ${tasks.length}</span><button aria-label="下一个任务" onclick="selectTask(selected+1)">›</button></div>`}$('task-tabs').innerHTML=tasks.map((t,i)=>`<button class="task-tab ${i===selected?'active':''}" onclick="selectTask(${i})" aria-pressed="${i===selected}">${esc(t.title)}<span>${status(t)}</span></button>`).join('')}
function stop(){clearInterval(timer);timer=null;$('auto').textContent='自动演示'}function advance(){if(state.paused||state.cancelled||state.stage===5)return;state.stage++;render();if(state.stage===3||state.stage===5)stop()}function pause(){state.paused=!state.paused;if(state.paused)stop();render()}function cancelTask(){stop();state.cancelled=true;render();toast('任务已取消，演示进展已保留')}function autoRun(){if(timer){stop();return}if(state.stage===5||state.cancelled){state.stage=1;state.cancelled=false;state.paused=false;render()}if(state.stage===3){toast('请先确认任务方向，再继续自动演示');return}state.paused=false;render();$('auto').textContent='停止自动演示';timer=setInterval(advance,2600)}function reset(){stop();tasks=seedTasks();selected=0;state=tasks[0];coverList=false;render()}function preset(i){$('prompt').value=samples[i];$('prompt').focus()}function toggleMini(){miniMode=!miniMode;$('full').classList.toggle('hidden',miniMode);$('desktop').classList.toggle('hidden',!miniMode);$('toggle').textContent=miniMode?'展开任务工作台 ↗':'收起为桌面卡片 ↙'}function showFull(){if(miniMode)toggleMini();$('task').scrollIntoView({behavior:'smooth',block:'nearest'});toast('已在内屏接续同一个任务')}
function modal(html){$('modal').className='modal-backdrop';$('modal').innerHTML='<section class="modal" role="dialog" aria-modal="true">'+html+'</section>';let target=$('modal').querySelector('textarea,button');if(target)target.focus()}function closeModal(){$('modal').className='hidden';$('modal').innerHTML=''}function newTask(){modal('<h2>交代一件事</h2><p>从外屏快速下发，同步到内屏继续处理。</p><textarea id="new-input" aria-label="新任务内容" maxlength="240" placeholder="例如：整理今天的 AI PC 新闻…"></textarea><button onclick="simulateVoice()">◉ 模拟语音输入</button><footer><button onclick="closeModal()">取消</button><button class="primary" onclick="submitModal()">生成任务卡</button></footer>')}function simulateVoice(){$('new-input').value=samples[0];toast('模拟语音已转写，未使用麦克风')}function submitModal(){create($('new-input').value)}function create(value){let v=value.trim();if(!v){toast('请先输入任务内容');return}stop();state={title:v.length>22?v.slice(0,22)+'…':v,request:v,stage:0,paused:false,cancelled:false};tasks.push(state);selected=tasks.length-1;coverList=false;closeModal();$('prompt').value='';render();toast('任务已同步，请确认并开始')}
function editDirection(){modal('<h2>补充任务要求</h2><p>补充后会同步到内外屏，已完成的进展会保留。</p><textarea id="addition" aria-label="补充要求" maxlength="240" placeholder="例如：重点关注外屏交互和合盖使用场景"></textarea><footer><button onclick="closeModal()">取消</button><button class="primary" onclick="saveAddition()">保存要求</button></footer>')}function saveAddition(){let v=$('addition').value.trim();if(!v){toast('请填写补充要求');return}state.request+='\n补充：'+v;closeModal();render();toast('已同步补充要求')}function result(){modal('<h2>任务成果</h2><p>演示摘要 · 可保存完整文本</p><div style="max-height:340px;overflow:auto;white-space:pre-line;font-size:13px">'+esc(resultText())+'</div><footer><button onclick="closeModal()">关闭</button><button class="primary" onclick="download()">保存 Markdown ↓</button></footer>')}function download(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([resultText()],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download='随行AI-任务成果.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('演示成果已保存')}let toastTimer;function toast(s){clearTimeout(toastTimer);$('toast').textContent=s;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}$('compose').addEventListener('submit',e=>{e.preventDefault();create($('prompt').value)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('modal').classList.contains('hidden')){let focus=[...$('modal').querySelectorAll('button,textarea')];if(e.shiftKey&&document.activeElement===focus[0]){e.preventDefault();focus.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focus.at(-1)){e.preventDefault();focus[0].focus()}}});render();
</script></body></html>
